[project]
name = "esky"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "starlette",
    "uvicorn[standard]",
    "sqlite-vec",
    "fastembed",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
esky = "esky.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esky"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: opt-in tests requiring real models or services"]
addopts = "-m 'not slow'"
asyncio_mode = "auto"
