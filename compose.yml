name: ai-mem

services:
  ai-mem:
    build:
      context: .
      target: prod
    container_name: ai-mem
    ports:
      # Bind to the LAN interface explicitly. No auth in Phase 1 (spec §10):
      # do not change this to 0.0.0.0 without adding per-profile tokens first.
      - "${AI_MEM_BIND:-127.0.0.1}:${AI_MEM_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ai-mem-models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Development harness. Not started by `docker compose up`.
  # Run with: docker compose run --rm test pytest -v
  test:
    build:
      context: .
      target: dev
    profiles: ["dev"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ai-mem-models:/models
    environment:
      PYTHONHASHSEED: "0"
      AI_MEM_DATA_DIR: /tmp/ai-mem-data

volumes:
  ai-mem-models:
