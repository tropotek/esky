name: esky

services:
  esky:
    build:
      context: .
      target: prod
    container_name: esky
    # Run as the host user so files written to ./data are host-readable.
    # 0:0 is the default only so the file works without a .env.
    user: "${ESKY_UID:-0}:${ESKY_GID:-0}"
    ports:
      # Bind to the LAN interface explicitly. Per-profile bearer tokens landed
      # in Phase 1.5, so LAN exposure is supported — but issue tokens before
      # widening this, and do not reach for 0.0.0.0 when a LAN IP will do.
      - "${ESKY_BIND:-127.0.0.1}:${ESKY_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - esky-models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Development harness. Not started by `docker compose up`.
  # Run with: docker compose run --rm test pytest -v
  test:
    build:
      context: .
      target: dev
    profiles: ["dev"]
    user: "${ESKY_UID:-0}:${ESKY_GID:-0}"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - esky-models:/models
    environment:
      PYTHONHASHSEED: "0"
      # Harmless once the container runs as the host user, but keeps the
      # source tree clean of stray __pycache__ dirs either way.
      PYTHONDONTWRITEBYTECODE: "1"
      ESKY_DATA_DIR: /tmp/esky-data

volumes:
  esky-models:
