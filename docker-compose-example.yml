# Esky — production compose for operators. Copy this file to docker-compose-live.yml in an empty
# folder (that name is what livesites.sh looks for), add a .env next to it, and start it.
#
#   docker compose -f docker-compose-live.yml up -d                   start
#   docker compose -f docker-compose-live.yml pull && \
#   docker compose -f docker-compose-live.yml up -d                   upgrade to a newer image
#   docker compose -f docker-compose-live.yml exec esky esky <cmd>    run the CLI (profile create, token issue, ...)
#
# After an upgrade that bumps the schema, run `esky profile migrate <name>` for every profile.
#
# Put settings in a .env file next to this one (optional), e.g.:
#   ESKY_BIND=192.168.0.12      # host interface to publish on; prefer a LAN IP over 0.0.0.0
#   ESKY_PORT=8011              # host port
#   ESKY_UID=1000               # run as this host user so data/ stays owned by you (`id -u`)
#   ESKY_GID=1000               # (`id -g`)
#   ESKY_MAX_DISTANCE=0.9       # vector relevance floor; see docs/operations.md before changing
#
# Backups: data/ holds one SQLite file per profile. Stop the container (or use sqlite3 .backup)
# and archive data/.

name: z-esky

services:
  esky:
    image: ${ESKY_IMAGE:-ghcr.io/tropotek/esky}:${ESKY_TAG:-latest}
    pull_policy: always  # stop + start (livesites p, s) picks up a new :latest
    container_name: esky
    restart: unless-stopped
    user: "${ESKY_UID:-0}:${ESKY_GID:-0}"
    ports:
      - "${ESKY_BIND:-127.0.0.1}:${ESKY_PORT:-8080}:8080"
    volumes:
      # Every profile database. This is all the state there is.
      - ./data:/data
      # No /models volume: the embedding model is baked into the image, and a volume
      # would keep an old copy in place of the one a newer image ships.
    environment:
      HF_HOME: /models
      # Only the tuning values are read from .env. The fallbacks track config.py, since an
      # unset variable would otherwise pass an empty string and override the default.
      ESKY_EMBED_MODEL: "${ESKY_EMBED_MODEL:-BAAI/bge-small-en-v1.5}"
      ESKY_RRF_K: "${ESKY_RRF_K:-60}"
      ESKY_MAX_DISTANCE: "${ESKY_MAX_DISTANCE:-0.9}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
